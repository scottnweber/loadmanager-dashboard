<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Load Manager Inc — Project Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-hover: #222632;
      --border: #2a2e3d;
      --text: #e4e6ed;
      --text-dim: #8b8fa3;
      --accent-blue: #4f8ff7;
      --accent-green: #34d399;
      --accent-yellow: #fbbf24;
      --accent-red: #f87171;
      --accent-purple: #a78bfa;
      --accent-cyan: #22d3ee;
      --accent-orange: #fb923c;
      --accent-pink: #f472b6;
      --radius: 12px;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    
    /* Header */
    .header {
      background: linear-gradient(135deg, #1e2235 0%, #2a1f3d 100%);
      border-bottom: 1px solid var(--border);
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .header-left h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .header-left p {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 2px;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .last-updated {
      font-size: 12px;
      color: var(--text-dim);
      background: rgba(255,255,255,0.05);
      padding: 6px 12px;
      border-radius: 6px;
    }
    
    .refresh-btn {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    
    .refresh-btn:hover { opacity: 0.85; }
    
    /* Summary Cards */
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      padding: 24px 32px;
    }
    
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    
    .summary-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    
    .summary-card .info .number {
      font-size: 24px;
      font-weight: 700;
    }
    
    .summary-card .info .label {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
    }
    
    /* Projects Grid */
    .section-title {
      padding: 0 32px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 12px;
    }
    
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 16px;
      padding: 0 32px 32px;
    }
    
    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: border-color 0.2s, transform 0.15s;
    }
    
    .project-card:hover {
      border-color: var(--accent-blue);
      transform: translateY(-2px);
    }
    
    .project-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    
    .project-name {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .project-name .icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    
    .project-name h3 {
      font-size: 15px;
      font-weight: 600;
    }
    
    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    
    .status-on-track {
      background: rgba(52, 211, 153, 0.12);
      color: var(--accent-green);
    }
    
    .status-in-progress {
      background: rgba(79, 143, 247, 0.12);
      color: var(--accent-blue);
    }
    
    .status-blocked {
      background: rgba(248, 113, 113, 0.12);
      color: var(--accent-red);
    }
    
    .status-waiting {
      background: rgba(251, 191, 36, 0.12);
      color: var(--accent-yellow);
    }
    
    .status-planning {
      background: rgba(167, 139, 250, 0.12);
      color: var(--accent-purple);
    }
    
    .status-complete {
      background: rgba(34, 211, 238, 0.12);
      color: var(--accent-cyan);
    }
    
    .project-url {
      font-size: 12px;
      color: var(--accent-blue);
      margin-bottom: 12px;
    }
    
    .project-url a {
      color: inherit;
      text-decoration: none;
    }
    
    .project-url a:hover {
      text-decoration: underline;
    }
    
    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    
    .progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s;
    }
    
    .progress-text {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }
    
    .project-notes {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    
    .project-notes strong {
      color: var(--text);
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    
    .project-notes .note {
      padding-left: 12px;
      position: relative;
    }
    
    .project-notes .note::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--accent-blue);
    }
    
    .last-seen {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 10px;
      font-style: italic;
    }
    
    /* Footer */
    .footer {
      text-align: center;
      padding: 20px 32px;
      font-size: 12px;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
    }
    
    /* Responsive */
    @media (max-width: 600px) {
      .header { padding: 16px 16px; }
      .summary { padding: 16px; grid-template-columns: repeat(2, 1fr); }
      .projects { grid-template-columns: 1fr; padding: 0 16px 16px; }
      .section-title { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1>Load Manager Inc — Project Dashboard</h1>
      <p>Logistics software projects & customer side work</p>
    </div>
    <div class="header-right">
      <span class="last-updated" id="lastUpdated">Loading...</span>
      <button class="refresh-btn" onclick="location.reload()">↻ Refresh</button>
    </div>
  </div>
  
  <div class="summary" id="summaryCards"></div>
  
  <div class="section-title">Active Projects</div>
  <div class="projects" id="projectsGrid"></div>
  
  <div class="footer">
    Managed by Hermes — daily briefings via @Macbook2150_bot
  </div>
  
  <script>
    const projectColors = {
      blue:   { bg: 'rgba(79,143,247,0.15)',  fill: '#4f8ff7' },
      green:  { bg: 'rgba(52,211,153,0.15)',  fill: '#34d399' },
      purple: { bg: 'rgba(167,139,250,0.15)', fill: '#a78bfa' },
      cyan:   { bg: 'rgba(34,211,238,0.15)',  fill: '#22d3ee' },
      orange: { bg: 'rgba(251,146,60,0.15)',  fill: '#fb923c' },
      pink:   { bg: 'rgba(244,114,182,0.15)', fill: '#f472b6' },
      yellow: { bg: 'rgba(251,191,36,0.15)',  fill: '#fbbf24' },
      red:    { bg: 'rgba(248,113,113,0.15)', fill: '#f87171' },
    };
    
    const projectIcons = {
      'tms': '🚛',
      'mobile': '📱',
      'onboard': '📋',
      'lookout': '🔍',
      'edi': '📡',
      'loadboard': '📦',
      'legacy': '🗄️',
    };
    
    // ── Project Data ──
    // Update this section or load from projects.json for dynamic updates
    const projects = [
      {
        name: "Load Manager TMS",
        url: "https://loadmanager.com",
        icon: "🚛",
        status: "on-track",
        color: "blue",
        progress: 85,
        notes: [
          "Core TMS product — ongoing customer features",
          "Side projects managed by Hermes"
        ]
      },
      {
        name: "Locate My Freight",
        url: "https://locatemyfreight.com",
        icon: "📱",
        status: "on-track",
        color: "green",
        progress: 70,
        notes: [
          "Mobile app for freight tracking"
        ]
      },
      {
        name: "Onboard Carrier",
        url: "https://onboardcarrier.com",
        icon: "📋",
        status: "planning",
        color: "purple",
        progress: 20,
        notes: [
          "Site registered but not live yet"
        ]
      },
      {
        name: "Carrier Lookout",
        url: "https://CarrierrLookout.com",
        icon: "🔍",
        status: "planning",
        color: "cyan",
        progress: 10,
        notes: [
          "Domain acquired — site not live"
        ]
      },
      {
        name: "Load Manager EDI",
        url: "https://loadmanageredi.com",
        icon: "📡",
        status: "on-track",
        color: "orange",
        progress: 60,
        notes: [
          "X12: 204, 990, 214, 210 motor carrier flow via Mirth Connect"
        ]
      },
      {
        name: "LoadBoardXchange",
        url: "https://LoadBoardXchange.com",
        icon: "📦",
        status: "in-progress",
        color: "pink",
        progress: 30,
        notes: [
          "Gathering available loads from existing LMTMS customers"
        ]
      },
      {
        name: "Legacy MS Access Apps",
        icon: "🗄️",
        status: "waiting",
        color: "yellow",
        progress: 40,
        notes: [
          "2 apps built in MS Access (.accdb) with SQL Server backend"
        ]
      }
    ];
    
    function formatDate(ts) {
      if (!ts) return 'Not yet updated';
      const d = new Date(ts);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    
    function renderSummary(projects) {
      const counts = {};
      projects.forEach(p => {
        counts[p.status] = (counts[p.status] || 0) + 1;
      });
      
      const statusEmojis = {
        'on-track': '🟢',
        'in-progress': '🔵',
        'blocked': '🔴',
        'waiting': '🟡',
        'planning': '🟣',
        'complete': '🔵'
      };
      
      let html = `
        <div class="summary-card">
          <div class="summary-icon" style="background: rgba(79,143,247,0.15);">📊</div>
          <div class="info">
            <div class="number">${projects.length}</div>
            <div class="label">Total Projects</div>
          </div>
        </div>
      `;
      
      Object.entries(counts).forEach(([status, count]) => {
        html += `
          <div class="summary-card">
            <div class="summary-icon" style="background: ${projectColors[statusesToColor[status] || 'blue'].bg};">
              ${statusEmojis[status] || '📌'}
            </div>
            <div class="info">
              <div class="number">${count}</div>
              <div class="label">${status.replace('-', ' ').replace(/\b\w/g, c => c.toUpperCase())}</div>
            </div>
          </div>
        `;
      });
      
      return html;
    }
    
    const statusesToColor = {
      'on-track': 'green',
      'in-progress': 'blue',
      'blocked': 'red',
      'waiting': 'yellow',
      'planning': 'purple',
      'complete': 'cyan'
    };
    
    function renderProjects(projects) {
      return projects.map(p => {
        const c = projectColors[p.color] || projectColors.blue;
        const statusColor = projectColors[statusesToColor[p.status] || 'blue'].fill;
        
        return `
          <div class="project-card">
            <div class="project-header">
              <div class="project-name">
                <div class="icon" style="background: ${c.bg};">${p.icon}</div>
                <h3>${p.name}</h3>
              </div>
              <span class="status-badge status-${p.status}">${p.status.replace('-', ' ').replace(/\b\w/g, c => c.toUpperCase())}</span>
            </div>
            ${p.url ? `<div class="project-url"><a href="${p.url}" target="_blank">${p.url}</a></div>` : ''}
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${p.progress}%; background: ${c.fill};"></div>
            </div>
            <div class="progress-text">${p.progress}% complete</div>
            <div class="project-notes">
              <strong>Latest Notes</strong>
              ${p.notes.map(n => `<div class="note">${n}</div>`).join('')}
            </div>
          </div>
        `;
      }).join('');
    }
    
    // ── Render ──
    document.getElementById('lastUpdated').textContent = formatDate(Date.now());
    document.getElementById('summaryCards').innerHTML = renderSummary(projects);
    document.getElementById('projectsGrid').innerHTML = renderProjects(projects);
  </script>
</body>
</html>
